  theme: { extend: {
    colors: {
      primary: '#2563EB', deep: '#1E3A8A', accent: '#F97316',
      ok: '#10B981', warn: '#F59E0B', danger: '#EF4444',
      bgc: '#F8FAFC', ink: '#0F172A', sub: '#64748B', line: '#E2E8F0'
    },
    fontFamily: { sans: ['"PingFang SC"','"Microsoft YaHei"','"Noto Sans SC"','system-ui','sans-serif'] },
    maxWidth: { shell: '1280px' }
  }}

<style>
/* ============ 设计契约：基础 & 动效关键帧 ============ */
:root{
  --primary:#2563EB; --deep:#1E3A8A; --accent:#F97316; --ok:#10B981;
  --warn:#F59E0B; --danger:#EF4444; --bgc:#F8FAFC; --ink:#0F172A; --sub:#64748B; --line:#E2E8F0;
  --sh-sm:0 1px 2px rgba(15,23,42,.06); --sh-md:0 8px 24px rgba(15,23,42,.10); --sh-lg:0 16px 48px rgba(37,99,235,.18);
}
*{-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bgc);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;overflow-x:hidden}
::selection{background:rgba(37,99,235,.18)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* 页面切换：淡入 + 轻微上滑 300ms ease-out */
.page-enter{animation:fadeUp .3s ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(37,99,235,.45)}50%{transform:scale(1.05);box-shadow:0 0 0 14px rgba(37,99,235,0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes heartPop{0%{transform:scale(0)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes starOn{0%{opacity:.2;transform:scale(.6)}60%{opacity:1;transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes spinStar{to{transform:rotate(360deg)}}
@keyframes dotBlink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes rippleAnim{to{transform:scale(2.6);opacity:0}}
@keyframes drawStroke{to{stroke-dashoffset:0}}
@keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:1}}

/* 导航 */
#topnav{transition:background .3s,box-shadow .3s,backdrop-filter .3s}
#topnav.scrolled{background:rgba(255,255,255,.78);backdrop-filter:blur(14px);box-shadow:var(--sh-sm)}
.nav-item{position:relative;padding:6px 2px;color:var(--sub);font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;transition:color .2s}
.nav-item:hover{color:var(--primary)}
.nav-item::after{content:'';position:absolute;left:0;bottom:-2px;height:2.5px;width:0;border-radius:2px;background:linear-gradient(90deg,var(--primary),#60A5FA);transition:width .25s ease-out}
.nav-item:hover::after{width:100%}
.nav-item.nav-active{color:var(--primary);font-weight:700}
.nav-item.nav-active::after{width:100%}

/* 按钮：点击 scale(0.97) + 涟漪 */
.btn{position:relative;overflow:hidden;transition:transform .12s ease,box-shadow .2s,background .2s;cursor:pointer;user-select:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--primary),#3B82F6);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.32)}
.btn-primary:hover{box-shadow:0 10px 26px rgba(37,99,235,.42)}
.btn-ghost{border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rippleAnim .55s ease-out forwards;pointer-events:none}
.ripple.dark{background:rgba(37,99,235,.16)}

/* 卡片悬浮 */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-sm);transition:transform .25s ease,box-shadow .25s ease,border-color .25s}
.card-hover:hover{transform:translateY(-4px);box-shadow:var(--sh-md);border-color:#C7D7FE}

/* 标签多选：背景变化 + 轻微弹跳 */
.tag-sel{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--sub);font-size:13px;cursor:pointer;transition:all .18s cubic-bezier(.34,1.56,.64,1)}
.tag-sel:hover{border-color:var(--primary);color:var(--primary)}
.tag-sel.on{background:var(--primary);border-color:var(--primary);color:#fff;transform:scale(1.05)}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}

/* 概率环 / 进度条流光 */
.prog{height:8px;border-radius:99px;background:#EEF2F7;overflow:hidden;position:relative}
.prog>i{display:block;height:100%;border-radius:99px;position:relative;transition:width 1s cubic-bezier(.22,1,.36,1)}
.prog>i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);background-size:200% 100%;animation:shimmer 1.8s linear infinite}
.donut-arc{stroke-dasharray:var(--dash);stroke-dashoffset:var(--dash);animation:drawStroke 1.1s .15s cubic-bezier(.22,1,.36,1) forwards}

/* 折线图描边绘制 */
.line-draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:drawStroke 1.6s .2s ease-out forwards}
.bar-grow{transform-origin:bottom;transform:scaleY(0);animation:barUp .8s cubic-bezier(.22,1,.36,1) forwards}
@keyframes barUp{to{transform:scaleY(1)}}

/* 数字滚动条 / Hero 网格背景 */
.hero-grid{background-image:linear-gradient(rgba(37,99,235,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.07) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse 90% 70% at 50% 30%,#000 40%,transparent 100%)}
.glass{background:rgba(255,255,255,.72);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.65)}

/* 时间轴 */
.tl-node{transition:all .4s}
.tl-node.lit .tl-dot{box-shadow:0 0 0 6px rgba(37,99,235,.15);animation:glowPulse 2s infinite}

/* Tab 指示器滑动 */
.tabs{position:relative}
.tab-ind{position:absolute;bottom:0;height:3px;border-radius:3px;background:var(--primary);transition:left .3s ease,width .3s ease}

/* 星级 */
.star{display:inline-block;color:#E2E8F0;transition:color .2s}
.star.on{color:var(--warn);animation:starOn .45s both}

/* 收藏爱心 */
.fav-btn{transition:transform .15s}
.fav-btn.faved{color:var(--danger)!important;animation:heartPop .45s}

/* AI 助手 */
#aiFab{animation:breathe 2.6s ease-in-out infinite}
#aiPanel{transform-origin:bottom right;transition:transform .28s cubic-bezier(.34,1.4,.64,1),opacity .22s}
#aiPanel.hide{transform:scale(.6) translateY(30px);opacity:0;pointer-events:none}
.typing i{width:6px;height:6px;border-radius:50%;background:#94A3B8;display:inline-block;margin:0 1.5px;animation:dotBlink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}

/* 模态框 */
#modalMask{transition:opacity .25s}
#modalBox{transition:transform .28s cubic-bezier(.34,1.3,.64,1),opacity .24s}
/* 隐藏时整层禁用指针事件：透明容器不能挡住页面点击 */
#modal.modal-hide{pointer-events:none}
.modal-hide #modalMask{opacity:0;pointer-events:none}
.modal-hide #modalBox{transform:scale(.9) translateY(26px);opacity:0}

/* Loading 星形 */
.load-star{width:44px;height:44px;color:var(--primary);animation:spinStar 1.1s linear infinite}

/* 拖拽 */
.dragging{opacity:.45;box-shadow:var(--sh-lg)!important;transform:scale(1.01)}
.drag-over{border-color:var(--primary)!important;border-style:dashed!important}

/* 评价轮播 */
#tCarousel{transition:transform .5s cubic-bezier(.22,1,.36,1)}

/* 输入框 */
.inp{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;transition:border-color .2s,box-shadow .2s;outline:none}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
.inp.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(239,68,68,.12)}

/* 开关 */
.sw{position:relative;width:42px;height:24px;border-radius:99px;background:#CBD5E1;transition:background .25s;cursor:pointer;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:var(--sh-sm);transition:transform .25s}
.sw.on{background:var(--primary)}.sw.on::after{transform:translateX(18px)}

/* 复选勾 */
.ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:all .2s;flex:none;background:#fff}
.ck.on{background:var(--primary);border-color:var(--primary)}

@media (max-width:1023px){#navMenu{display:none}#navMenu.open{display:flex}}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
</style>
</head>

/* Toast 提示（顶部滑入） */
function toast(msg,type='ok'){
  const colors={ok:'bg-ink text-white',err:'bg-danger text-white',warn:'bg-warn text-white',info:'bg-primary text-white'};
  const icons={ok:'✅',err:'⛔',warn:'⚠️',info:'ℹ️'};
  const t=document.createElement('div');
  t.className=`${colors[type]} rounded-xl px-4 py-3 shadow-lg flex items-center gap-2 text-sm font-medium`;
  t.style.animation='toastIn .3s ease-out both';
  t.innerHTML=`<span>${icons[type]}</span><span>${esc(msg)}</span>`;
  $('#toastBox').appendChild(t);
  setTimeout(()=>{t.style.transition='all .35s';t.style.opacity=0;t.style.transform='translateY(-12px)';setTimeout(()=>t.remove(),360);},2600);
}
/* 模态框（缩放弹出 + 遮罩模糊） */
function openModal(html){
  const m=$('#modal');$('#modalBox').innerHTML=html;
  m.classList.remove('modal-hide');document.body.style.overflow='hidden';
}
function closeModal(){$('#modal').classList.add('modal-hide');document.body.style.overflow='';}
$('#modalMask').addEventListener('click',closeModal);

/* 数字滚动动画（requestAnimationFrame） */
function countUp(el,target,{dur=1400,suffix='',dec=0}={}){
  const t0=performance.now();
  function tick(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    el.textContent=(target*e).toFixed(dec).replace(/\B(?=(\d{3})+(?!\d))/g,',')+suffix;
    if(p<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
/* 页面内触发所有 data-count 数字滚动 */
function bindCounters(root=document){
  $$('[data-count]',root).forEach(el=>{
    if(el._counted)return;el._counted=true;
    countUp(el,parseFloat(el.dataset.count),{suffix:el.dataset.suffix||'',dec:+(el.dataset.dec||0)});
  });
}
/* 滚动 reveal 动画（IntersectionObserver） */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12});
function bindReveals(root=document){$$('.reveal',root).forEach(el=>io.observe(el));}
/* 按钮涟漪 */
document.addEventListener('click',e=>{
  const b=e.target.closest('.btn');if(!b)return;
  const r=document.createElement('span'),rect=b.getBoundingClientRect(),s=Math.max(rect.width,rect.height);
  r.className='ripple '+(b.classList.contains('btn-primary')?'':'dark');
  r.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-rect.left-s/2}px;top:${e.clientY-rect.top-s/2}px`;
  b.appendChild(r);setTimeout(()=>r.remove(),600);
});

/* -------------------- CHART：纯 SVG 图表引擎（无外部图表库） -------------------- */
/* 环形概率进度（描边绘制动画） */
function donut(pct,color,size=92,stroke=9){
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="flex-none">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#EEF2F7" stroke-width="${stroke}" fill="none"/>
    <circle class="donut-arc" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none"
      stroke-linecap="round" style="--dash:${c}" stroke-dashoffset="${c}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="47%" text-anchor="middle" dominant-baseline="middle" font-size="${size*.22}" font-weight="800" fill="${color}">${pct}%</text>
    <text x="50%" y="68%" text-anchor="middle" font-size="${size*.11}" fill="#94A3B8">录取概率</text>
  </svg>`;
}
/* 折线趋势图（描边绘制 + 面积渐变） */
function lineChart(values,labels,{w=560,h=200,color='#2563EB',unit='分'}={}){
  const min=Math.min(...values)-3,max=Math.max(...values)+3,px=40,py=22;
  const X=i=>px+(w-px*1.4)*i/(values.length-1||1), Y=v=>h-py-(h-py*1.8)*(v-min)/(max-min||1);
  const pts=values.map((v,i)=>[X(i),Y(v)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const gid='lg'+Math.random().toString(36).slice(2,7);
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${[0,.33,.66,1].map(f=>`<line x1="${px}" x2="${w-8}" y1="${py+(h-py*1.8)*f}" y2="${py+(h-py*1.8)*f}" stroke="#EEF2F7"/>`).join('')}
    <path d="${d} L ${X(values.length-1)} ${h-py} L ${X(0)} ${h-py} Z" fill="url(#${gid})"/>
    <path class="line-draw" d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="${color}" stroke-width="2.5"/>
      <text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" font-size="12" font-weight="700" fill="${color}">${values[i]}${unit}</text>
      <text x="${p[0]}" y="${h-4}" text-anchor="middle" font-size="11" fill="#94A3B8">${labels[i]}</text>`).join('')}
  </svg>`;
}
/* 雷达图 */
function radar(values,labels,{size=280,color='#2563EB',max=100}={}){
  const cx=size/2,cy=size/2,R=size/2-42,n=labels.length;
  const pt=(i,f)=>{const a=-Math.PI/2+2*Math.PI*i/n;return [cx+R*f*Math.cos(a),cy+R*f*Math.sin(a)];};
  const ring=f=>labels.map((_,i)=>pt(i,f).map(v=>v.toFixed(1)).join(' ')).join(' ');
  const dataPts=values.map((v,i)=>pt(i,Math.min(1,v/max)));
  return `<svg viewBox="0 0 ${size} ${size}" class="w-full max-w-[320px] mx-auto">
    ${[.25,.5,.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="#E8EEF6"/>`).join('')}
    ${labels.map((_,i)=>{const p=pt(i,1);return `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#E8EEF6"/>`;}).join('')}
    <polygon points="${dataPts.map(p=>p.map(v=>v.toFixed(1)).join(' ')).join(' ')}" fill="${color}22" stroke="${color}" stroke-width="2.5" class="radar-poly" style="transform-origin:center;animation:popIn .8s ease-out both"/>
    ${dataPts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${color}"/>`).join('')}
    ${labels.map((l,i)=>{const p=pt(i,1.24);return `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#475569" font-weight="600">${l}</text>`;}).join('')}
  </svg>`;
}
/* 横向柱状对比 */
function hbar(items,{unit='',color='#2563EB',max}={}){
  const m=max||Math.max(...items.map(i=>i.v));
  return `<div class="space-y-3">${items.map((it,i)=>`
    <div><div class="flex justify-between text-[13px] mb-1"><span class="font-medium">${esc(it.k)}</span><b style="color:${it.color||color}">${it.v}${unit}</b></div>
    <div class="prog"><i style="width:0%;background:${it.color||color}" data-w="${(it.v/m*100).toFixed(1)};transition-delay:${i*120}ms"></i></div></div>`).join('')}</div>`;
}
/* 页面渲染后触发进度条填充（data-w 支持 "宽度;附加样式" 格式） */
function bindBars(root=document){requestAnimationFrame(()=>requestAnimationFrame(()=>$$('.prog>i',root).forEach(i=>{
  const w=i.dataset.w;if(!w)return;
  const seg=w.split(';');i.style.width=parseFloat(seg[0])+'%';
  if(seg.length>1)i.style.cssText+=';'+seg.slice(1).join(';');
})));}

/* 首页 Hero 粒子连线背景（requestAnimationFrame 优化） */
function initHeroCanvas(){
  const cv=$('#heroCanvas');if(!cv)return;
  const ctx=cv.getContext('2d');let W,H,pts=[];
  function resize(){W=cv.width=cv.offsetWidth;H=cv.height=cv.offsetHeight;
    pts=Array.from({length:Math.min(46,W/28)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}));}
  resize();window.addEventListener('resize',resize);
  (function loop(){
    if(!document.body.contains(cv))return; // 页面卸载即停止
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      ctx.fillStyle='rgba(37,99,235,.5)';ctx.beginPath();ctx.arc(p.x,p.y,1.6,0,7);ctx.fill();});
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=dx*dx+dy*dy;
      if(d<12000){ctx.strokeStyle=`rgba(37,99,235,${(1-d/12000)*.22})`;ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke();}}
    requestAnimationFrame(loop);
  })();
}

    (!f.level||u.tags.includes(f.level))&&(!f.type||u.type===f.type)&&(!f.nature||u.nature===f.nature));
  if(f.sort==='分数线')list=[...list].sort((a,b)=>b.scores[0]-a.scores[0]);
  if(f.sort==='就业率')list=[...list].sort((a,b)=>b.jobRate-a.jobRate);

  return list;
}

function renderMockCheck(){
  const vol=state.volunteer;
  const probs=vol.map(v=>v.prob);
  const checks=[
    {name:'志愿是否填满',st:vol.length>=45?'pass':vol.length>0?'warn':'err',tip:vol.length>=45?'已填满 45 个志愿':`仅填报 ${vol.length}/45 个，建议填满以最大化录取机会`},
    {name:'梯度是否合理',st:vol.length<3?'warn':(probs[0]||0)>(probs[probs.length-1]||100)?'err':'pass',tip:vol.length<3?'志愿数量不足，无法评估梯度':'概率应从高到低排列（先冲后保），检测到'+(vol.length&&probs[0]<=probs[probs.length-1]?'正常梯度':'梯度倒挂！')},
    {name:'是否有重复院校',st:new Set(vol.map(v=>v.uid)).size===vol.length?'pass':'err',tip:'平行志愿中重复填报同一院校会浪费志愿位'},
    {name:'是否有重复专业',st:new Set(vol.map(v=>v.major)).size===vol.length||vol.length<2?'pass':'warn',tip:'不同院校填报相同专业可以接受，但建议分散方向'},
    {name:'是否勾选服从调剂',st:vol.every(v=>v.adjust)?'pass':vol.some(v=>v.adjust)?'warn':'err',tip:vol.every(v=>v.adjust)?'全部勾选，退档风险最低':'存在未勾选调剂的志愿，冲区院校退档风险高'},
    {name:'是否有无效志愿',st:'pass',tip:'所有志愿的选科要求与你的选科组合匹配'}
  ];
  const ic={pass:['✅','text-ok','bg-ok/10'],warn:['⚠️','text-warn','bg-warn/10'],err:['⛔','text-danger','bg-danger/10']};
  return `<div class="mt-4 border-t border-line pt-4 grid md:grid-cols-2 gap-2.5">
    ${checks.map(c=>`<div class="flex items-start gap-2.5 rounded-xl border border-line p-3 cursor-pointer hover:border-primary/40 transition-colors" onclick="toast('${c.tip}','${c.st==='pass'?'ok':c.st==='warn'?'warn':'err'}')">
      <span class="${ic[c.st][2]} w-7 h-7 rounded-lg flex items-center justify-center text-sm flex-none">${ic[c.st][0]}</span>
      <div><b class="text-[13px] ${ic[c.st][1]}">${c.name}</b><p class="text-[11px] text-sub mt-0.5">${c.tip}</p></div>
    </div>`).join('')}
  </div>`;
}
function addToMock(uid){
  if(state.volunteer.some(v=>v.uid===uid)){toast('该院校已在志愿表中','warn');return;}
  if(state.volunteer.length>=45){toast('志愿表已满（45 个）','warn');return;}
  const found=[...SMART_RESULT.rush,...SMART_RESULT.stable,...SMART_RESULT.safe].find(x=>x.uid===uid);
  const prob=found?found.prob:Math.round(Math.max(20,Math.min(95,100-(uniById(uid).scores[0]-600)*1.6)));
  state.volunteer.push({uid,major:uniById(uid).hotMajors[0],adjust:true,prob});
  closeModal();
  if(state.page==='mock')rerender();
  toast(`已添加「${uniById(uid).name}」到志愿表（第 ${state.volunteer.length} 志愿）`,'ok');
}
function toggleAdjust(i){state.volunteer[i].adjust=!state.volunteer[i].adjust;rerender();}
function replaceMajor(i){
  const u=uniById(state.volunteer[i].uid),cur=state.volunteer[i].major;
  const next=u.hotMajors[(u.hotMajors.indexOf(cur)+1)%u.hotMajors.length];
  state.volunteer[i].major=next;rerender();toast(`专业已替换为「${next}」`,'ok');
}
/* 拖拽排序（原生 DnD） */
function initVolDrag(){
  const list=$('#volList');if(!list)return;let from=null;
  $$('.vol-row',list).forEach(row=>{
    row.addEventListener('dragstart',e=>{from=+row.dataset.idx;row.classList.add('dragging');});
    row.addEventListener('dragend',()=>{row.classList.remove('dragging');$$('.vol-row',list).forEach(r=>r.classList.remove('drag-over'));});
    row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('drag-over');});
    row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));
    row.addEventListener('drop',e=>{
      e.preventDefault();const to=+row.dataset.idx;if(from===null||from===to)return;
      const [m]=state.volunteer.splice(from,1);state.volunteer.splice(to,0,m);
      rerender();toast(`已调整志愿顺序：${from+1} → ${to+1}`,'ok');
    });
  });
}

  if(kind==='majors')return `<div class="grid md:grid-cols-2 gap-3">${[...state.favMajors].map(id=>{const m=majorById(id);return `
    <div class="border border-line rounded-xl p-3.5 flex items-center gap-3 cursor-pointer hover:border-primary/40" onclick="openMajorModal(${id})">
    <span class="w-10 h-10 rounded-xl bg-ok/10 text-ok flex items-center justify-center">📚</span>
    <div class="flex-1"><b class="text-sm">${m.name}</b><p class="text-xs text-sub">${m.cat} · 薪资 ${(m.salary/1000).toFixed(1)}k</p></div>
    <button class="btn text-danger text-sm" onclick="event.stopPropagation();toggleFavMajor(${id},this);rerender()">❤️</button></div>`;}).join('')||'<p class="text-sub text-sm col-span-2 py-8 text-center">还没有收藏专业</p>'}</div>`;
  return `<div class="space-y-3">${POSTS.slice(0,2).map(p=>`<div class="border border-line rounded-xl p-3.5 text-sm cursor-pointer hover:border-primary/40"><b>${p.title}</b><p class="text-xs text-sub mt-1">${p.author} · ${p.time}</p></div>`).join('')}</div>`;
}
function favTab(el,kind){$$('#favTabs .nav-item').forEach(n=>n.classList.remove('nav-active'));el.classList.add('nav-active');$('#favBody').innerHTML=renderFavBody(kind);}
function markAllRead(){state.msgs.forEach(m=>m.unread=false);updateBell();rerender();toast('已全部标记为已读','ok');}

/* -------------------- ROUTER：SPA 路由 -------------------- */
const ROUTES={home:renderHome,smart:renderSmart,unis:renderUnis,majors:renderMajors,assess:renderAssess,mock:renderMock,compare:renderCompare,career:renderCareer,community:renderCommunity,profile:renderProfile};
function go(page){
  if(!ROUTES[page])return;
  state.page=page;
  clearInterval(tTimer);
  const root=$('#page-root');
  root.innerHTML=`<div class="page-enter">${ROUTES[page]()}</div>`;
  /* 高亮当前导航（单一 active 规则） */
  $$('#navMenu .nav-item').forEach(n=>n.classList.toggle('nav-active',n.dataset.nav===page));
  $('#navMenu').classList.remove('open');
  window.scrollTo({top:0});
  bindCounters(root);bindBars(root);bindReveals(root);
  if(page==='home'){initHeroCanvas();initCarousel();}
  if(page==='mock')initVolDrag();
}
/* 当前页原地重渲染（保持滚动位置的交互更新用） */
function rerender(){
  const y=window.scrollY;
  $('#page-root').innerHTML=ROUTES[state.page]();
  bindCounters();bindBars();bindReveals();
  if(state.page==='home'){initHeroCanvas();initCarousel();}
  if(state.page==='mock')initVolDrag();
  window.scrollTo({top:y});
}
/* data-go 委托（导航/卡片跳转） */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g)go(g.dataset.go);
});

/* -------------------- 全局组件 -------------------- */
/* 导航滚动毛玻璃 + 回到顶部 */
const backTop=$('#backTop');
window.addEventListener('scroll',()=>{
  $('#topnav').classList.toggle('scrolled',window.scrollY>24);
  const show=window.scrollY>480;
  backTop.classList.toggle('hidden',!show);backTop.classList.toggle('flex',show);
},{passive:true});
backTop.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
$('#navBurger').onclick=()=>$('#navMenu').classList.toggle('open');
/* 省份切换 */
$('#gProvince').onchange=e=>{state.province=e.target.value;toast('已切换到「'+e.target.value+'」考区数据','ok');if(state.page==='home'||state.page==='mock')rerender();};

/* 通知中心 */
function updateBell(){
  const n=state.msgs.filter(m=>m.unread).length,b=$('#bellBadge');
  b.textContent=n;b.style.display=n?'flex':'none';
  $('#bellList').innerHTML=state.msgs.map(m=>`
    <div class="px-4 py-3 border-b border-line/60 last:border-0 hover:bg-bgc cursor-pointer ${m.unread?'':'opacity-60'}">
      <div class="flex items-center gap-2"><b class="text-[13px]">${m.t}</b>${m.unread?'<span class="w-1.5 h-1.5 rounded-full bg-danger"></span>':''}<span class="flex-1"></span><span class="text-[11px] text-sub">${m.time}</span></div>
      <p class="text-xs text-sub mt-1">${m.d}</p>
    </div>`).join('');
}
$('#bellBtn').onclick=e=>{e.stopPropagation();$('#bellDrop').classList.toggle('hidden');updateBell();};
$('#bellClear').onclick=()=>{state.msgs.forEach(m=>m.unread=false);updateBell();toast('已全部标记为已读','ok');};
document.addEventListener('click',e=>{if(!e.target.closest('#bellBtn')&&!e.target.closest('#bellDrop'))$('#bellDrop').classList.add('hidden');});

/* 全局搜索建议 */
$('#gSearch').addEventListener('input',e=>{
  const v=e.target.value.trim(),drop=$('#gSearchDrop');
  if(!v){drop.classList.add('hidden');return;}
  const us=UNIS.filter(u=>u.name.includes(v)).slice(0,3).map(u=>({icon:'🏫',t:u.name,s:'院校 · '+u.city,fn:`closeSearch();openUniModal(${u.id})`}));
  const ms=MAJORS.filter(m=>m.name.includes(v)).slice(0,3).map(m=>({icon:'📚',t:m.name,s:'专业 · '+m.cat,fn:`closeSearch();openMajorModal(${m.id})`}));
  const qs=QA.filter(q=>q.q.includes(v)).slice(0,2).map(q=>({icon:'❓',t:q.q,s:'问答 · '+q.answers+' 回答',fn:`closeSearch();state.commTab='全部';go('community')`}));
  const all=[...us,...ms,...qs];
  drop.innerHTML=all.length?all.map(x=>`<div class="px-4 py-2.5 hover:bg-bgc cursor-pointer flex items-center gap-2.5 text-sm" onclick="${x.fn}"><span>${x.icon}</span><div class="min-w-0"><b class="block truncate text-[13px]">${x.t}</b><span class="text-[11px] text-sub">${x.s}</span></div></div>`).join('')
    :`<div class="px-4 py-3 text-sm text-sub">未找到「${esc(v)}」相关内容</div>`;
  drop.classList.remove('hidden');
});
function closeSearch(){$('#gSearchDrop').classList.add('hidden');$('#gSearch').value='';}
document.addEventListener('click',e=>{if(!e.target.closest('#gSearch')&&!e.target.closest('#gSearchDrop'))$('#gSearchDrop').classList.add('hidden');});

/* -------------------- AI 志愿助手 -------------------- */
const AI_QUICK=['我 600 分能上 985 吗？','计算机和软件工程怎么选？','什么是服从调剂？','平行志愿怎么投档？','推荐几个就业前景好的专业'];
const AI_KB=[
  {k:['600','985'],r:{text:'以北京物理类为例，600 分（位次约 8000-10000）冲击 985 机会有限，但可以这样布局：',cards:[{t:'🎯 可冲的 985（概率 20-35%）',d:'西北农林科技大学、中国海洋大学（中外合作）、兰州大学部分专业'},{t:'🛡️ 稳妥选择',d:'优质 211：北京邮电大学、西安电子科技大学的优势专业，就业不输 985'},{t:'💡 建议',d:'如果看重学校牌子，接受偏远地区 985；如果看重专业，选头部 211 的王牌专业'}],go:{label:'生成我的专属方案',page:'smart'}}},
  {k:['计算机','软件工程'],r:{text:'两个专业就业率都很高（95%/94%），核心区别在这 3 点：',cards:[{t:'📚 课程侧重',d:'计科：更重理论（组成原理、编译原理），软硬件都学；软工：更重工程（项目开发、测试、DevOps）'},{t:'💰 就业与薪资',d:'软工起薪略高（11.5k vs 12k 持平），计科研招面更广'},{t:'🎓 深造方向',d:'打算考研选计科（学硕对口多），打算本科就业选软工（项目经验丰富）'}],go:{label:'对比这两个专业',page:'compare'}}},
  {k:['服从调剂'],r:{text:'服从调剂 = 同意学校在你未录满的专业中为你分配，是平行志愿的「安全带」。',cards:[{t:'✅ 勾选的后果',d:'分数不够所报专业时，被调到该校其他专业，但保住这个学校'},{t:'⛔ 不勾的后果',d:'分数不够所报专业 → 直接退档，本批次其他志愿全部作废'},{t:'💡 择校星建议',d:'冲区院校必须勾；稳保区看该校是否有你绝对不接受的专业'}],go:{label:'查看避坑指南',page:'community'}}},
  {k:['平行志愿','投档'],r:{text:'平行志愿投档三原则：分数优先、遵循志愿、一轮投档。',cards:[{t:'1️⃣ 分数优先',d:'全省考生按分数排队，高分先投档，与你把学校填在第几位无关'},{t:'2️⃣ 遵循志愿',d:'轮到你时，从第 1 志愿开始依次检索，遇到有计划余额的院校即投档'},{t:'3️⃣ 一轮投档',d:'每人每批次只有一次投档机会！投档后被退档，只能等征集志愿'}],go:{label:'看官方动画详解',page:'community'}}},
  {k:['就业前景','就业好','推荐'],r:{text:'结合 2025 就业质量报告，这几个方向近五年持续「绿牌」：',cards:[{t:'🥇 人工智能（13k/月）',d:'需求年增 40%+，算法、自动驾驶、大模型方向最吃香'},{t:'🥈 数据科学与大数据（11k/月）',d:'各行业数字化转型刚需，金融/零售/制造都在抢人'},{t:'🥉 电气工程（9k/月）',d:'国家电网校招大户，新能源赛道第二增长曲线'}],go:{label:'查看专业库',page:'majors'}}}
];
function aiToggle(open){$('#aiPanel').classList.toggle('hide',!open);}
$('#aiFab').onclick=()=>aiToggle($('#aiPanel').classList.contains('hide'));
$('#aiClose').onclick=()=>aiToggle(false);
function aiMsg(html,me=false){
  const box=$('#aiMsgs'),d=document.createElement('div');
  d.className='flex '+(me?'justify-end':'justify-start');
  d.innerHTML=`<div class="${me?'bg-primary text-white rounded-2xl rounded-br-md':'bg-white border border-line rounded-2xl rounded-bl-md'} px-3.5 py-2.5 max-w-[85%] text-[13px] leading-relaxed shadow-sm">${html}</div>`;
  box.appendChild(d);box.scrollTop=box.scrollHeight;return d;
}
/* 打字机逐字输出 */
function typewriter(el,text,done){
  let i=0;el.innerHTML='';
  (function tick(){if(i<=text.length){el.innerHTML=esc(text.slice(0,i));i+=2;setTimeout(tick,18);}else if(done)done();})();
}
function aiAsk(q){
  if(!q.trim())return;
  aiMsg(esc(q),true);$('#aiInput').value='';
  const typing=aiMsg('<span class="typing"><i></i><i></i><i></i></span>');
  setTimeout(()=>{
    const hit=AI_KB.find(x=>x.k.some(k=>q.includes(k)))||{r:{text:'这个问题我已记录。基于你的档案（650 分 · 物理类），我先给你一条通用建议：志愿填报的核心是「位次法」——用你的全省排名对照院校近 3 年录取位次，比单纯看分数可靠得多。',cards:[{t:'💡 试试问我',d:'「平行志愿怎么投档」「服从调剂是什么」「推荐就业前景好的专业」'}],go:{label:'打开智能填报',page:'smart'}}};
    const r=hit.r,bubble=typing.querySelector('div');
    bubble.innerHTML='';
    const span=document.createElement('span');bubble.appendChild(span);
    typewriter(span,r.text,()=>{
      bubble.insertAdjacentHTML('beforeend',r.cards.map(c=>`<div class="bg-bgc rounded-xl p-2.5 mt-2 border border-line"><b class="text-[12px]">${c.t}</b><p class="text-[12px] text-sub mt-0.5">${c.d}</p></div>`).join(''));
      if(r.go)bubble.insertAdjacentHTML('beforeend',`<button class="btn btn-primary rounded-lg px-3 py-1.5 text-xs mt-2.5 w-full" onclick="aiToggle(false);go('${r.go.page}')">${r.go.label} →</button>`);
      $('#aiMsgs').scrollTop=$('#aiMsgs').scrollHeight;
    });
  },900);
}
$('#aiSend').onclick=()=>aiAsk($('#aiInput').value);
$('#aiInput').addEventListener('keydown',e=>{if(e.key==='Enter')aiAsk(e.target.value);});
$('#aiQuick').innerHTML=AI_QUICK.map(q=>`<span class="tag-sel flex-none !text-[11px]" onclick="aiAsk('${q}')">${q}</span>`).join('');
/* 欢迎语 */
aiMsg('👋 你好，我是择校星 AI 志愿分析师。已读取你的档案：<b>650 分 · 北京 · 物理类</b>。有什么填报问题，直接问我吧！');

/* -------------------- 初始化 -------------------- */
updateBell();
go('home');</script>
