<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>梦屿 Dream Bank — 你的梦，值得被记住</title>
<script src="./js/tailwindcss.js"></script>
<script>
  /* Tailwind 主题扩展：梦境色板 */
  tailwind.config = { theme: { extend: { colors: {
    space:'#0B1026', midnight:'#1E1B4B', aurora:'#8B5CF6', nebula:'#EC4899',
    dreamcyan:'#06B6D4', moon:'#F8FAFC', gold:'#FBBF24'
  }}}};
</script>
<style>
/* ============================================================
   梦屿 Dream Bank · 设计令牌与全局动效
   ============================================================ */
:root{
  --bg:#0B1026; --bg2:#1E1B4B;
  --aurora:#8B5CF6; --nebula:#EC4899; --cyan:#06B6D4; --moon:#F8FAFC; --gold:#FBBF24;
  --fear:#7C3AED; --excite:#F472B6; --confuse:#94A3B8; --calm:#34D399; --sad:#60A5FA; --anger:#F87171; --warm:#FBBF24;
  --ink:#F8FAFC; --ink-sub:rgba(226,232,240,.62);
  --glass:rgba(255,255,255,.06); --glass-brd:rgba(255,255,255,.12);
  --hue-tint:rgba(139,92,246,.10); /* 情绪染色层，随记录页选择变化 */
}
*{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:#05070f; color:var(--ink);
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,sans-serif;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.font-display{ font-family:'Unbounded','Montserrat','Arial Black','PingFang SC',sans-serif; }
.font-poem{ font-family:'Noto Serif SC','Source Han Serif SC','STSong','SimSun',serif; }

/* ---------- 手机外框（桌面端居中，移动端铺满） ---------- */
.phone{
  position:relative; width:min(430px,100vw); height:min(932px,100vh); height:min(932px,100dvh);
  background:radial-gradient(120% 90% at 50% 0%, var(--bg2) 0%, var(--bg) 55%, #070a1a 100%);
  overflow:hidden; isolation:isolate;
  transition:background 1.2s ease;
}
@media (min-width:480px){
  .phone{ border-radius:44px; border:1px solid rgba(255,255,255,.14);
    box-shadow:0 0 0 10px #10131f, 0 0 0 12px rgba(255,255,255,.06), 0 40px 120px rgba(0,0,0,.8), 0 0 90px rgba(139,92,246,.25); }
}
/* 明亮模式（渐变过渡，不生硬切换） */
.phone.light{
  --ink:#1E1B4B; --ink-sub:rgba(30,27,75,.6);
  --glass:rgba(255,255,255,.55); --glass-brd:rgba(30,27,75,.10);
  background:radial-gradient(120% 90% at 50% 0%, #e0e7ff 0%, #f5f3ff 55%, #fdf4ff 100%);
}
.phone, .phone *{ transition-property:background-color,border-color,color; transition-duration:.5s; }

/* ---------- 极光流动背景 + 粒子画布 ---------- */
.aurora-bg{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.aurora-bg i{
  position:absolute; width:130%; height:60%; border-radius:50%;
  filter:blur(70px); opacity:.5; mix-blend-mode:screen;
  animation:auroraDrift 26s ease-in-out infinite alternate;
}
.aurora-bg i:nth-child(1){ left:-30%; top:-15%; background:radial-gradient(closest-side,#8B5CF6,transparent 70%); }
.aurora-bg i:nth-child(2){ right:-40%; top:20%; background:radial-gradient(closest-side,#06B6D4,transparent 70%); animation-duration:32s; animation-delay:-8s; }
.aurora-bg i:nth-child(3){ left:-20%; bottom:-25%; background:radial-gradient(closest-side,#EC4899,transparent 70%); animation-duration:38s; animation-delay:-16s; opacity:.35; }
@keyframes auroraDrift{
  0%{ transform:translate3d(0,0,0) rotate(0deg) scale(1); }
  50%{ transform:translate3d(8%,6%,0) rotate(8deg) scale(1.12); }
  100%{ transform:translate3d(-6%,-4%,0) rotate(-6deg) scale(.95); }
}
#particles{ position:absolute; inset:0; z-index:1; pointer-events:none; }
.tint-layer{ position:absolute; inset:0; z-index:1; pointer-events:none; background:var(--hue-tint); transition:background 1s ease; }

/* ---------- 毛玻璃 / 卡片 ---------- */
.glass{ background:var(--glass); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--glass-brd); border-radius:20px; }
.card-float{ animation:floatY 7s ease-in-out infinite; }
@keyframes floatY{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-7px);} }
.hoverable{ transition:transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s ease, filter .35s ease; }
.hoverable:hover{ transform:scale(1.03); box-shadow:0 12px 40px rgba(139,92,246,.28), 0 0 24px rgba(139,92,246,.18); }
.pressable{ transition:transform .18s cubic-bezier(.34,1.56,.64,1); position:relative; overflow:hidden; }
.pressable:active{ transform:scale(.95); }

/* 点击涟漪 */
.ripple{ position:absolute; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.5),transparent 65%);
  transform:scale(0); animation:ripple .7s ease-out forwards; pointer-events:none; }
@keyframes ripple{ to{ transform:scale(3.2); opacity:0; } }

/* ---------- 通用 keyframes ---------- */
@keyframes twinkle{ 0%,100%{ opacity:.15; transform:scale(.7);} 50%{ opacity:1; transform:scale(1.15);} }
@keyframes breathe{ 0%,100%{ filter:drop-shadow(0 0 8px rgba(139,92,246,.5)); transform:scale(1);} 50%{ filter:drop-shadow(0 0 26px rgba(236,72,153,.85)); transform:scale(1.04);} }
@keyframes breatheBtn{ 0%,100%{ box-shadow:0 0 0 0 rgba(139,92,246,.55), 0 0 22px rgba(139,92,246,.6);} 50%{ box-shadow:0 0 0 14px rgba(139,92,246,0), 0 0 40px rgba(236,72,153,.75);} }
@keyframes spinSlow{ to{ transform:rotate(360deg);} }
@keyframes floatX{ 0%,100%{ transform:translate(0,0) rotate(var(--r,0deg)); } 33%{ transform:translate(10px,-16px) rotate(calc(var(--r,0deg) + 5deg)); } 66%{ transform:translate(-12px,-6px) rotate(calc(var(--r,0deg) - 5deg)); } }
@keyframes pulseRing{ 0%{ box-shadow:0 0 0 0 rgba(251,191,36,.6);} 100%{ box-shadow:0 0 0 12px rgba(251,191,36,0);} }
@keyframes popIn{ 0%{ transform:scale(.5) translateY(30px); opacity:0;} 70%{ transform:scale(1.05) translateY(-4px);} 100%{ transform:scale(1) translateY(0); opacity:1;} }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(26px);} to{ opacity:1; transform:translateY(0);} }
@keyframes shimmer{ 0%{ transform:translateX(-120%);} 100%{ transform:translateX(320%);} }
@keyframes shakeX{ 0%,100%{ transform:translateX(0) rotate(0);} 20%{ transform:translateX(-3px) rotate(-2deg);} 40%{ transform:translateX(3px) rotate(2deg);} 60%{ transform:translateX(-2px) rotate(-1deg);} 80%{ transform:translateX(2px) rotate(1deg);} }
@keyframes wiggle{ 0%,100%{ transform:rotate(-4deg);} 50%{ transform:rotate(4deg);} }
@keyframes jelly{ 0%{ transform:scale(1,1);} 30%{ transform:scale(1.25,.75);} 45%{ transform:scale(.8,1.2);} 60%{ transform:scale(1.12,.9);} 75%{ transform:scale(.95,1.05);} 100%{ transform:scale(1,1);} }
@keyframes fireJump{ 0%,100%{ transform:translateY(0) scale(1);} 30%{ transform:translateY(-6px) scale(1.25) rotate(-8deg);} 60%{ transform:translateY(1px) scale(.92);} }
@keyframes toastIn{ from{ transform:translateY(-120%); opacity:0;} to{ transform:translateY(0); opacity:1;} }
@keyframes sheetUp{ from{ transform:translateY(105%);} to{ transform:translateY(0);} }
@keyframes sheetDown{ from{ transform:translateY(0);} to{ transform:translateY(105%);} }
@keyframes fadeIn{ from{ opacity:0;} to{ opacity:1;} }
@keyframes fadeOut{ from{ opacity:1;} to{ opacity:0;} }
@keyframes blinkCaret{ 50%{ opacity:0;} }
@keyframes waveBar{ 0%,100%{ transform:scaleY(.25);} 50%{ transform:scaleY(1);} }
@keyframes confettiFall{ 0%{ transform:translateY(-10vh) rotate(0); opacity:1;} 100%{ transform:translateY(105vh) rotate(720deg); opacity:0;} }
@keyframes heartFly{ 0%{ transform:translate(0,0) scale(.5); opacity:1;} 100%{ transform:translate(var(--dx),var(--dy)) scale(1.3); opacity:0;} }
@keyframes burstP{ 0%{ transform:translate(0,0) scale(1); opacity:1;} 100%{ transform:translate(var(--dx),var(--dy)) scale(0); opacity:0;} }
@keyframes netCatch{ 0%{ transform:scale(1) rotate(0); opacity:1;} 60%{ transform:scale(.2) rotate(300deg); opacity:.9;} 100%{ transform:scale(0) rotate(420deg); opacity:0;} }
@keyframes flashOnce{ 0%{ opacity:0;} 30%{ opacity:1;} 100%{ opacity:0;} }
@keyframes lineDraw{ to{ stroke-dashoffset:0; } }
@keyframes tearHalf{ to{ transform:translate(var(--tx),26px) rotate(var(--tr)); opacity:0; } }
@keyframes boxShake{ 0%,100%{ transform:rotateX(0) rotateY(0) translateY(0);} 15%{ transform:rotateX(9deg) rotateY(-9deg) translateY(-7px);} 30%{ transform:rotateX(-8deg) rotateY(8deg) translateY(2px);} 45%{ transform:rotateX(7deg) rotateY(-6deg) translateY(-6px);} 60%{ transform:rotateX(-6deg) rotateY(5deg) translateY(1px);} 75%{ transform:rotateX(4deg) rotateY(-3deg) translateY(-3px);} }
@keyframes glowSweep{ 0%{ transform:translateX(-140%) skewX(-18deg);} 100%{ transform:translateX(340%) skewX(-18deg);} }
@keyframes tabBounce{ 0%{ transform:translateY(0) scale(1);} 40%{ transform:translateY(-7px) scale(1.18);} 70%{ transform:translateY(1px) scale(.94);} 100%{ transform:translateY(0) scale(1);} }
@keyframes skeleton{ 0%{ background-position:-200px 0;} 100%{ background-position:200px 0;} }
@keyframes driftWord{ 0%,100%{ transform:translate(0,0);} 50%{ transform:translate(var(--wx,6px),var(--wy,-8px));} }
@keyframes newDreamBar{ 0%{ transform:translateY(-110%);} 12%,88%{ transform:translateY(0);} 100%{ transform:translateY(-110%);} }

/* ---------- 启动页 ---------- */
#splash{ position:absolute; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(130% 100% at 50% 110%, #1E1B4B 0%, #0B1026 55%, #05070f 100%);
  animation:splashFall 2.2s cubic-bezier(.22,1,.36,1) both; transition:opacity .9s ease, transform .9s ease; }
@keyframes splashFall{ from{ clip-path:circle(0% at 50% 40%);} to{ clip-path:circle(140% at 50% 40%);} }
#splash.leaving{ opacity:0; transform:scale(1.14); pointer-events:none; }
.splash-star{ position:absolute; border-radius:50%; background:#fff; animation:twinkle var(--tw,3s) ease-in-out infinite; }
.splash-elem{ position:absolute; font-size:var(--sz,26px); opacity:.75; filter:drop-shadow(0 0 10px rgba(139,92,246,.6));
  animation:floatX var(--dur,11s) ease-in-out infinite; will-change:transform; }
.logo-breathe{ animation:breathe 3.2s ease-in-out infinite; }

/* ---------- 底部 Tab ---------- */
#tabbar{ position:absolute; left:14px; right:14px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:40;
  display:flex; justify-content:space-around; padding:9px 6px;
  background:rgba(15,18,40,.6); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.12); border-radius:26px;
  box-shadow:0 14px 40px rgba(0,0,0,.45); }
.phone.light #tabbar{ background:rgba(255,255,255,.65); }
.tab-item{ display:flex; flex-direction:column; align-items:center; gap:2px; width:60px; padding:4px 0;
  color:var(--ink-sub); font-size:10px; cursor:pointer; position:relative; border-radius:16px;
  transition:color .3s; background:none; border:none; }
.tab-item .ti{ font-size:20px; line-height:1; transition:transform .3s; display:inline-block; }
.tab-item.active{ color:var(--ink); }
.tab-item.active .ti{ animation:tabBounce .55s cubic-bezier(.34,1.56,.64,1); }
.tab-item.active::after{ content:""; position:absolute; top:-8px; width:22px; height:3.5px; border-radius:99px;
  background:linear-gradient(90deg,var(--aurora),var(--nebula)); box-shadow:0 0 12px var(--aurora); }

/* ---------- 页面切换 ---------- */
.page{ position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; z-index:10;
  padding:18px 18px 118px; opacity:0; transform:translateY(22px); pointer-events:none;
  transition:opacity .32s cubic-bezier(.22,1,.36,1), transform .32s cubic-bezier(.22,1,.36,1);
  scrollbar-width:none; }
.page::-webkit-scrollbar{ display:none; }
.page.current{ opacity:1; transform:translateY(0); pointer-events:auto; }
.page.enter{ animation:fadeUp .36s cubic-bezier(.22,1,.36,1); }

/* ---------- 情绪泡泡 ---------- */
.bubble{ position:absolute; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:22px; cursor:pointer; user-select:none; will-change:transform;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.5), var(--bc,rgba(139,92,246,.35)) 62%, transparent 78%);
  border:1px solid rgba(255,255,255,.35); backdrop-filter:blur(4px);
  box-shadow:inset 0 0 18px rgba(255,255,255,.14), 0 6px 22px rgba(0,0,0,.25);
  transition:box-shadow .3s; }
.bubble:hover{ box-shadow:inset 0 0 22px rgba(255,255,255,.25), 0 6px 30px var(--bc,rgba(139,92,246,.5)); }

/* ---------- 明信片卡片 ---------- */
.postcard{ position:relative; border-radius:18px; padding:16px 16px 14px; cursor:pointer;
  background:linear-gradient(135deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.13); backdrop-filter:blur(14px);
  box-shadow:0 10px 28px rgba(0,0,0,.35); overflow:hidden;
  transition:transform .5s cubic-bezier(.22,1,.36,1), box-shadow .4s, opacity .5s; }
.postcard::before{ content:""; position:absolute; inset:0 auto 0 0; width:5px; background:var(--ec,var(--aurora)); opacity:.9; }
.postcard .swatch{ position:absolute; right:-26px; top:-26px; width:104px; height:104px; border-radius:50%;
  background:radial-gradient(circle, var(--ec,var(--aurora)) 0%, transparent 70%); opacity:.4; filter:blur(4px); }
.postcard.swiped{ transform:translateX(var(--swx,0)); }
.postcard.new-in{ animation:popIn .7s cubic-bezier(.34,1.56,.64,1) both; }

/* ---------- 捕梦网录音钮 ---------- */
.net-ring{ position:absolute; inset:-14px; border-radius:50%;
  background:
    repeating-conic-gradient(from 0deg, rgba(139,92,246,.0) 0deg 14deg, rgba(139,92,246,.5) 14deg 15.5deg),
    radial-gradient(circle, transparent 58%, rgba(139,92,246,.45) 60%, transparent 63%, rgba(6,182,212,.4) 74%, transparent 77%);
  -webkit-mask:radial-gradient(circle, transparent 54%, #000 55%);
          mask:radial-gradient(circle, transparent 54%, #000 55%);
  transition:transform 1s ease; }
.recording .net-ring{ animation:spinSlow 7s linear infinite; }
.rec-wave{ position:absolute; inset:-14px; border-radius:50%; border:2px solid rgba(139,92,246,.6);
  opacity:0; pointer-events:none; }
.recording .rec-wave{ animation:recRipple 1.8s ease-out infinite; }
.recording .rec-wave:nth-child(2){ animation-delay:.6s; } .recording .rec-wave:nth-child(3){ animation-delay:1.2s; }
@keyframes recRipple{ 0%{ transform:scale(1); opacity:.8;} 100%{ transform:scale(1.9); opacity:0;} }

/* ---------- 诗歌翻转卡 ---------- */
.flip-card{ perspective:1200px; }
.flip-inner{ position:relative; width:100%; height:100%; transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.22,1,.36,1); }
.flip-card.flipped .flip-inner{ transform:rotateY(180deg); }
.flip-face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:20px; }
.flip-back{ transform:rotateY(180deg); }

/* ---------- 图表 ---------- */
.donut-seg{ transition:stroke-width .3s, opacity .3s, filter .3s; cursor:pointer; }
.donut-seg:hover,.donut-seg.sel{ stroke-width:26; filter:drop-shadow(0 0 8px currentColor); }
.bar-fill{ position:relative; overflow:hidden; }
.bar-fill::after{ content:""; position:absolute; inset:0; width:38%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:shimmer 2.6s ease-in-out infinite; }
.grid-flow{ animation:shimmer 3.4s linear infinite; }

/* ---------- 词云 ---------- */
.cloud-wrap{ position:relative; }
.cloud-w{ position:absolute; cursor:pointer; white-space:nowrap; animation:driftWord var(--wd,6s) ease-in-out infinite;
  transition:color .3s, text-shadow .3s; will-change:transform; }
.cloud-w:hover{ color:#fff !important; text-shadow:0 0 14px var(--aurora); }

/* ---------- 开关（果冻动画） ---------- */
.switch{ width:50px; height:28px; border-radius:99px; background:rgba(255,255,255,.15); position:relative; cursor:pointer;
  transition:background .35s; border:1px solid var(--glass-brd); flex:none; }
.switch::after{ content:""; position:absolute; top:2.5px; left:3px; width:21px; height:21px; border-radius:50%;
  background:#fff; transition:transform .4s cubic-bezier(.34,1.8,.5,1); box-shadow:0 2px 8px rgba(0,0,0,.35); }
.switch.on{ background:linear-gradient(90deg,var(--aurora),var(--nebula)); }
.switch.on::after{ transform:translateX(21px); }
.switch.jelly::after{ animation:jelly .6s ease; }

/* ---------- 弹窗 / Toast / 骨架屏 ---------- */
.sheet-mask{ position:absolute; inset:0; z-index:70; background:rgba(5,7,15,.55); backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px); animation:fadeIn .35s ease; display:flex; align-items:flex-end; }
.sheet-mask.closing{ animation:fadeOut .3s ease forwards; }
.sheet{ width:100%; max-height:82%; overflow-y:auto; border-radius:28px 28px 0 0; padding:22px 20px calc(28px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, rgba(30,27,75,.92), rgba(11,16,38,.96));
  border:1px solid rgba(255,255,255,.14); border-bottom:none;
  animation:sheetUp .5s cubic-bezier(.22,1,.36,1); scrollbar-width:none; }
.sheet::-webkit-scrollbar{ display:none; }
.sheet-mask.closing .sheet{ animation:sheetDown .38s cubic-bezier(.5,0,.75,0) forwards; }
.center-mask{ align-items:center; justify-content:center; padding:26px; }
.center-mask .sheet{ border-radius:26px; border-bottom:1px solid rgba(255,255,255,.14); animation:popIn .5s cubic-bezier(.34,1.56,.64,1); max-height:78%; }
#toast-wrap{ position:absolute; top:calc(14px + env(safe-area-inset-top)); left:0; right:0; z-index:90; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
.toast{ padding:10px 20px; border-radius:99px; font-size:13px; color:var(--ink);
  background:rgba(20,24,52,.72); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.18);
  box-shadow:0 10px 30px rgba(0,0,0,.4), 0 0 18px rgba(139,92,246,.25);
  animation:toastIn .45s cubic-bezier(.34,1.56,.64,1); }
.toast.out{ animation:fadeOut .4s ease forwards, slideUpOut .4s ease forwards; }
@keyframes slideUpOut{ to{ transform:translateY(-16px);} }
.skl{ border-radius:14px; background:linear-gradient(90deg, rgba(255,255,255,.05) 25%, rgba(255,255,255,.13) 50%, rgba(255,255,255,.05) 75%);
  background-size:400px 100%; animation:skeleton 1.3s linear infinite; }

/* ---------- 盲盒 ---------- */
.gift-3d{ width:150px; height:150px; margin:0 auto; position:relative; transform-style:preserve-3d; animation:boxShake 1.1s ease-in-out infinite; }
.gift-face{ position:absolute; inset:0; border-radius:20px;
  background:linear-gradient(145deg,#8B5CF6,#5B21B6); border:1px solid rgba(255,255,255,.3);
  box-shadow:inset 0 0 30px rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; font-size:52px; }
.rarity-common{ box-shadow:0 0 30px rgba(148,163,184,.5); }
.rarity-rare{ box-shadow:0 0 40px rgba(6,182,212,.75); }
.rarity-legend{ box-shadow:0 0 55px rgba(251,191,36,.85), 0 0 110px rgba(236,72,153,.5); }

/* ---------- 音频波形 ---------- */
.wave{ display:flex; align-items:center; gap:3px; height:34px; }
.wave i{ width:3.5px; border-radius:99px; background:linear-gradient(180deg,var(--cyan),var(--aurora)); height:100%; transform-origin:center; }
.playing .wave i{ animation:waveBar var(--wb,.9s) ease-in-out infinite; }

/* ---------- 时间胶囊 ---------- */
.capsule{ border-radius:99px; padding:12px 18px; position:relative; overflow:hidden; }
.capsule::before{ content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);
  transform:translateX(-120%); animation:shimmer 3.8s ease-in-out infinite; }

/* ---------- 图鉴 ---------- */
.dex-item{ aspect-ratio:1; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  cursor:pointer; transition:transform .3s cubic-bezier(.34,1.56,.64,1); }
.dex-item:hover{ transform:scale(1.08); }
.dex-item.locked{ filter:grayscale(1); opacity:.4; }

/* ---------- 杂项 ---------- */
.hide{ display:none !important; }
.shake-anim{ animation:shakeX .5s ease; }
.wiggle-anim{ animation:wiggle 2.6s ease-in-out infinite; }
.fire-jump{ display:inline-block; animation:fireJump .7s cubic-bezier(.34,1.56,.64,1); }
.caret::after{ content:"▍"; animation:blinkCaret .9s steps(1) infinite; color:var(--cyan); }
.pulse-dot{ animation:pulseRing 1.6s ease-out infinite; }
.chip{ padding:6px 13px; border-radius:99px; font-size:12px; border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.05); color:var(--ink-sub); cursor:pointer; white-space:nowrap;
  transition:all .3s cubic-bezier(.34,1.56,.64,1); }
.chip.sel{ background:linear-gradient(90deg,rgba(139,92,246,.4),rgba(236,72,153,.35)); color:#fff;
  border-color:rgba(139,92,246,.7); box-shadow:0 0 14px rgba(139,92,246,.4); transform:translateY(-3px) scale(1.05); }
.emo-tag{ transition:all .28s cubic-bezier(.34,1.56,.64,1); cursor:pointer; }
.emo-tag.sel{ transform:scale(1.12) translateY(-3px); box-shadow:0 0 18px var(--c), 0 0 18px rgba(139,92,246,.55); border-color:var(--c); background:rgba(255,255,255,.12); color:#fff; }

/* Toast：顶部滑入，毛玻璃 */
function toast(msg, icon='✨'){
  const t = document.createElement('div');

  $('#toast-wrap').appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(), 420); }, 2400);
}

/* 数字滚动动画 */
function countUp(el, to, {dur=900, suffix=''}={}){
  const from = +el.dataset.v || 0; const t0 = performance.now();
  (function tick(t){
    const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
    el.textContent = Math.round(from+(to-from)*e) + suffix;
    if(p<1) requestAnimationFrame(tick); else el.dataset.v = to;
  })(t0);
}

/* 按钮涟漪 + 按压反馈（事件委托，全局生效） */
document.addEventListener('pointerdown', e=>{
  const b = e.target.closest('.pressable'); if(!b) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width,r.height);
  const rp = document.createElement('span'); rp.className = 'ripple';
  rp.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(rp); setTimeout(()=>rp.remove(), 700);
});
/* 重要操作震动反馈模拟 */

/* 磁吸按钮：指针靠近时向光标轻微移动 */
function bindMagnetic(scope=document){
  scope.querySelectorAll('.magnetic').forEach(btn=>{
    btn.onpointermove = e=>{
      const r = btn.getBoundingClientRect();
      const dx = e.clientX-(r.left+r.width/2), dy = e.clientY-(r.top+r.height/2);
      btn.style.transform = `translate(${dx*.16}px, ${dy*.22}px)`;
    };
    btn.onpointerleave = ()=>{ btn.style.transition='transform .5s cubic-bezier(.34,1.56,.64,1)'; btn.style.transform='';
      setTimeout(()=>btn.style.transition='',500); };
  });
}

  mask.innerHTML = `<div class="sheet">${html}</div>`;
  mask.addEventListener('pointerdown', e=>{ if(e.target===mask) closeSheet(mask); });
  $('#modal-root').appendChild(mask);
  return mask;
}
function closeSheet(mask){
  mask = mask || $('#modal-root .sheet-mask:last-child'); if(!mask) return;
  mask.classList.add('closing'); setTimeout(()=>mask.remove(), 380);
}

function initParticles(){
  const r = $('#phone').getBoundingClientRect();
  pts = Array.from({length:46}, ()=>({
    x:rand(0,r.width), y:rand(0,r.height), r:rand(.6,2.1),
    vx:rand(-.14,.14), vy:rand(-.2,-.05), tw:rand(0,Math.PI*2), hue:pick(['248,250,252','139,92,246','6,182,212','236,72,153'])
  }));
}
function drawParticles(t){
  const r = $('#phone').getBoundingClientRect();
  ctx.clearRect(0,0,r.width,r.height);
  for(const p of pts){
    /* 指针避让 */
    const dx=p.x-ptr.x, dy=p.y-ptr.y, d2=dx*dx+dy*dy;
    if(d2<5200){ const f=(5200-d2)/5200*.5; p.x+=dx/Math.sqrt(d2+1)*f*8; p.y+=dy/Math.sqrt(d2+1)*f*8; }
    p.x+=p.vx; p.y+=p.vy;
    if(p.y<-6){ p.y=r.height+6; p.x=rand(0,r.width); }
    if(p.x<-6) p.x=r.width+6; if(p.x>r.width+6) p.x=-6;
    const a = .25 + Math.abs(Math.sin(t/1400 + p.tw))*.55;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7);
    ctx.fillStyle = `rgba(${p.hue},${a})`; ctx.fill();
  }
  requestAnimationFrame(drawParticles);
}
$('#phone').addEventListener('pointermove', e=>{
  const r = $('#phone').getBoundingClientRect();
  ptr.x = e.clientX-r.left; ptr.y = e.clientY-r.top;
});
$('#phone').addEventListener('pointerleave', ()=>{ ptr.x=ptr.y=-999; });

/* 左滑显示快捷操作 */
function bindSwipe(row, card){
  let sx=0, dx=0, drag=false;
  card.addEventListener('pointerdown', e=>{ sx=e.clientX; drag=true; card.style.transition='none'; });
  window.addEventListener('pointermove', e=>{
    if(!drag) return; dx = Math.min(0, Math.max(-130, e.clientX-sx));
    if(Math.abs(dx)>8){ card.classList.add('swiped'); card.style.setProperty('--swx', dx+'px'); row.dataset.swiped='1'; }
  });
  window.addEventListener('pointerup', ()=>{
    if(!drag) return; drag=false; card.style.transition='';
    if(dx < -60){ card.style.setProperty('--swx','-118px'); }
    else { card.classList.remove('swiped'); card.style.setProperty('--swx','0px'); delete row.dataset.swiped; }
    dx=0;
  });
}

/* 情绪泡泡物理（rAF：漂浮 + 相互碰撞弹开） */
let bubbleRAF = null;
function initBubbles(zone){
  if(bubbleRAF) cancelAnimationFrame(bubbleRAF);
  zone.innerHTML='';
  const emos = DB.dreams.slice(0,7);
  const W = zone.clientWidth || 360, H = zone.clientHeight || 176;
  const bs = emos.map((d,i)=>({
    d, r:rand(22,30), x:rand(30,W-30), y:rand(34,H-34),
    vx:rand(-.25,.25)||.2, vy:rand(-.2,.2)||.15,
    el:null, dead:false
  }));
  bs.forEach(b=>{
    const el=document.createElement('div');
    el.className='bubble'; el.textContent=emoE(b.d.emo);
    el.style.cssText=`width:${b.r*2}px;height:${b.r*2}px;--bc:${emoC(b.d.emo)}88;left:0;top:0`;
    /* 点击 vs 长按判定 */
    let lp=null, long=false;
    el.addEventListener('pointerdown', ()=>{ long=false;
      lp=setTimeout(()=>{ long=true; burstBubble(b); }, 560); });
    el.addEventListener('pointerup', ()=>{ clearTimeout(lp); if(!long) toast(`${b.d.date} · ${b.d.title}：${b.d.text.slice(0,22)}…`, emoE(b.d.emo)); });
    el.addEventListener('pointerleave', ()=>clearTimeout(lp));
    b.el=el; zone.appendChild(el);
  });
  function burstBubble(b){
    if(b.dead) return; b.dead=true;
    const rect = zone.getBoundingClientRect();
    for(let i=0;i<12;i++){ /* 戳破粒子散开 */
      const p=document.createElement('i');
      p.style.cssText=`position:absolute;width:5px;height:5px;border-radius:50%;background:${emoC(b.d.emo)};
        left:${b.x}px;top:${b.y}px;--dx:${rand(-60,60)}px;--dy:${rand(-60,60)}px;animation:burstP .8s ease-out forwards;pointer-events:none`;
      zone.appendChild(p); setTimeout(()=>p.remove(),850);
    }
    b.el.remove(); toast('泡泡破掉了，梦还在银行里','🫧');
  }
  (function step(){
    if(!document.body.contains(zone)) return; /* 页面重渲染后停止 */
    for(const b of bs){ if(b.dead) continue;
      b.x+=b.vx; b.y+=b.vy;
      if(b.x<b.r||b.x>W-b.r) b.vx*=-1; if(b.y<b.r||b.y>H-b.r) b.vy*=-1;
      b.x=Math.max(b.r,Math.min(W-b.r,b.x)); b.y=Math.max(b.r,Math.min(H-b.r,b.y));
    }
    for(let i=0;i<bs.length;i++) for(let j=i+1;j<bs.length;j++){
      const a=bs[i], c=bs[j]; if(a.dead||c.dead) continue;
      const dx=c.x-a.x, dy=c.y-a.y, dist=Math.hypot(dx,dy), min=a.r+c.r;
      if(dist<min && dist>0){ /* 轻微弹开 */
        const push=(min-dist)/2*.35, ux=dx/dist, uy=dy/dist;
        a.x-=ux*push; a.y-=uy*push; c.x+=ux*push; c.y+=uy*push;
        a.vx-=ux*.02; a.vy-=uy*.02; c.vx+=ux*.02; c.vy+=uy*.02;
      }
    }
    for(const b of bs){ if(!b.dead) b.el.style.transform=`translate(${b.x-b.r}px,${b.y-b.r}px)`; }
    bubbleRAF=requestAnimationFrame(step);
  })();
}

/* 下拉刷新：捕梦网旋转 */
function bindPullRefresh(pageEl){
  let sy=0, pulling=false;
  pageEl.addEventListener('touchstart', e=>{ if(pageEl.scrollTop<=0){ sy=e.touches[0].clientY; pulling=true; } }, {passive:true});
  pageEl.addEventListener('touchmove', e=>{
    if(!pulling) return;
    const d = e.touches[0].clientY - sy;
    if(d>86 && !pageEl.dataset.refreshing){
      pageEl.dataset.refreshing='1';
      const spin=document.createElement('div');
      spin.className='absolute z-50 text-3xl'; spin.style.cssText='top:64px;left:50%;transform:translateX(-50%);animation:spinSlow 1s linear infinite';
      spin.textContent='🕸️'; pageEl.appendChild(spin);
      setTimeout(()=>{ spin.remove(); delete pageEl.dataset.refreshing; toast('捕梦网抖了抖，梦境已刷新','🕸️'); }, 1200);
    }
  }, {passive:true});
  pageEl.addEventListener('touchend', ()=>pulling=false);
}

/* 打字机逐字出现 */
function typewriter(box, text){
  box.innerHTML=''; box.classList.add('caret');
  let i=0;
  (function tick(){
    if(i<=text.length){ box.innerHTML = esc(text.slice(0,i)); i+=2; setTimeout(tick, 34); }
    else box.classList.remove('caret');
  })();
}

/* 超现实短诗生成器（本地 mock，按关键词拼意象） */
function makePoem(text){
  const pools = {
    '海':['海水是蓝色的沉默','门后藏着没有名字的清晨'], '水':['水忘记了自己的方向','把天空当作入海口'],
    '门':['每扇门都记得我','却都不肯承认'], '飞':['风替我收好翅膀','在云层的褶皱里'],
    '考':['白纸长出白色的森林','笔尖在迷宫里走失'], '城':['城市学会了呼吸','街道是它柔软的血管'],
  };
  let lines=[];
  for(const k in pools) if(text.includes(k)) lines.push(...pools[k]);
  const fallbacks=['我捧着发光的碎片','像捧着不敢说出口的话','夜把影子拉得很长','像一条回不去的河','醒来时枕头很满','装着我没说完的半句话'];
  while(lines.length<4) lines.push(fallbacks[lines.length % fallbacks.length]);
  return lines.slice(0, 4 + Math.floor(Math.random()*3)); /* 4-6 行 */
}

/* 环形图：从 0 开始绘制动画 */
function drawDonut(){
  const svg = $('#donutSvg'), legend = $('#donutLegend');
  const entries = Object.entries(DB.weekDist);
  const total = entries.reduce((s,[,v])=>s+v,0);
  const R=46, C=2*Math.PI*R; let acc=0;
  entries.forEach(([name,v])=>{
    const frac = v/total;
    const seg = document.createElementNS('http://www.w3.org/2000/svg','circle');
    seg.setAttribute('cx',60); seg.setAttribute('cy',60); seg.setAttribute('r',R);
    seg.setAttribute('fill','none'); seg.setAttribute('stroke', emoC(name));
    seg.setAttribute('stroke-width',16); seg.classList.add('donut-seg');
    seg.style.color = emoC(name);
    const len = C*frac - 3;
    seg.setAttribute('stroke-dasharray', `0 ${C}`);
    seg.setAttribute('stroke-dashoffset', -C*acc);
    seg.style.transition = 'stroke-dasharray 1s cubic-bezier(.22,1,.36,1)';
    svg.appendChild(seg);
    requestAnimationFrame(()=>requestAnimationFrame(()=>seg.setAttribute('stroke-dasharray', `${Math.max(len,0)} ${C-len}`)));
    seg.onclick = ()=>{
      $$('.donut-seg').forEach(s=>s.classList.remove('sel')); seg.classList.add('sel');
      $('#donutIco').textContent = emoE(name);
      $('#donutTxt').textContent = `${name} · ${v} 个梦`;
    };
    acc += frac;
    legend.innerHTML += `<div class="flex items-center gap-2" style="color:var(--ink-sub)">
      <i class="w-2.5 h-2.5 rounded-full flex-none" style="background:${emoC(name)}"></i>${name}<b class="ml-auto" style="color:var(--ink)">${v}</b></div>`;
  });
}

      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".45"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>

/* 梦境日历：情绪着色 + 当天脉冲光环 */
function drawCalendar(){
  const g = $('#calGrid');
  const emoOf = {}; DB.dreams.forEach(d=>{ const m=d.date.match(/8月(\d+)日/); if(m) emoOf[+m[1]]=d.emo; });
  const randEmo = ['平静','困惑','温暖','焦虑','兴奋'];
  let html = '<div></div>'.repeat(5); /* 8/1 是周六(2026) → 前留 5 空 */
  for(let d=1; d<=31; d++){
    const emo = emoOf[d] || (Math.random()<.5 ? pick(randEmo) : null);
    const isToday = d===26;
    html += `<div class="cal-day aspect-square rounded-lg flex items-center justify-center text-[11px] relative ${isToday?'pulse-dot font-bold':''} ${emo?'pressable':''}"
      data-day="${d}" data-emo="${emo||''}"
      style="cursor:${emo?'pointer':'default'}; ${emo?`background:${emoC(emo)}33;border:1px solid ${emoC(emo)}66;color:#fff`:'color:rgba(226,232,240,.3)'}
      ${isToday?';outline:2px solid var(--gold);outline-offset:1px':''}">${d}</div>`;
  }
  g.innerHTML = html;
  g.onclick = e=>{
    const c = e.target.closest('.cal-day[data-emo]'); if(!c || !c.dataset.emo) return;
    const d = DB.dreams.find(x=>x.date===`8月${c.dataset.day}日`);
    toast(d ? `8月${c.dataset.day}日 · ${d.title}：${d.text.slice(0,20)}…` : `8月${c.dataset.day}日 · 一个${c.dataset.emo}的梦`, emoE(c.dataset.emo));
  };
}

/* 词云：大小=频率，缓慢漂浮，点击筛选 */
function drawCloud(){
  const box = $('#wordCloud');
  const max = DB.wordCloud[0][1];
  const pos = [[8,4],[52,8],[30,22],[68,30],[6,40],[44,44],[76,52],[16,60],[55,64],[30,74],[70,76],[8,82],[46,86],[80,14],[24,52]];
  box.innerHTML = DB.wordCloud.map(([w,f],i)=>{
    const sz = 11 + (f/max)*17;
    return `<span class="cloud-w" data-w="${w}" style="left:${pos[i%pos.length][0]}%;top:${pos[i%pos.length][1]}%;
      font-size:${sz}px; color:rgba(${i%3===0?'139,92,246':i%3===1?'6,182,212':'236,72,153'},${.5+f/max*.5});
      --wd:${rand(4,8)}s; --wx:${rand(-8,8)}px; --wy:${rand(-9,9)}px; animation-delay:-${rand(0,6)}s">${w}</span>`;

  box.onclick = e=>{

/* 倒计时实时更新 */
let cdTimer=null;
function tickCountdowns(){
  if(cdTimer) clearInterval(cdTimer);
  const tick=()=>{
    $$('[data-cd]').forEach(elm=>{
      const t = new Date(elm.dataset.cd.replace(' ','T')) - Date.now();
      if(t<=0){ elm.textContent='🎉 可以开启了'; return; }
      const d=Math.floor(t/864e5), h=Math.floor(t%864e5/36e5), m=Math.floor(t%36e5/6e4), s=Math.floor(t%6e4/1e3);
      elm.textContent=`⏳ 距开启 ${d}天 ${h}时 ${m}分 ${s}秒`;
    });
  };
  tick(); cdTimer=setInterval(tick, 1000);
}

    if(!d.got) return toast('这个符号还没在你的梦里出现过，继续捕梦吧','❔');
    openSheet(`<div class="text-center pt-2">
      <div class="text-5xl logo-breathe inline-block">${d.icon}</div>
      <h3 class="font-display font-bold text-xl mt-3">「${d.n}」</h3>
      <p class="text-[13px] mt-3 leading-relaxed" style="color:var(--ink-sub)">${d.desc}</p>
      <div class="glass p-3 mt-4 text-[12px]" style="color:var(--ink-sub)">已出现 <b style="color:var(--gold)">${d.times}</b> 次 · 相关梦境 ${DB.dreams.filter(x=>x.tags.includes(d.n)).length} 条</div>
      <button class="pressable mt-5 px-10 py-3 rounded-full text-sm text-white" style="background:linear-gradient(90deg,#8B5CF6,#EC4899);border:none" onclick="closeSheet()">收进图鉴</button>
    </div>`, {center:true});
  };

  /* 功能列表 */
  $('#menuList').onclick = e=>{
    const row = e.target.closest('[data-m]'); if(!row) return;
    const m = row.dataset.m;
    if(m==='theme') return; /* 开关自己处理 */
    if(m==='清醒梦实验室') return go('train');
    if(m==='关于梦屿') return openSheet(`<div class="text-center py-4">
        <div class="font-display font-black text-3xl bg-clip-text text-transparent" style="background-image:linear-gradient(135deg,#F8FAFC,#8B5CF6,#EC4899)">梦屿</div>
        <div class="text-[11px] tracking-[.4em] mt-2" style="color:var(--ink-sub)">DREAM BANK · v0.1</div>
        <p class="text-[13px] mt-4 leading-relaxed" style="color:var(--ink-sub)">每晚都是一场私人电影。<br>我们把散场的票根，替你一张张收好。</p>
        <button class="pressable mt-6 px-10 py-3 rounded-full text-sm text-white" style="background:linear-gradient(90deg,#8B5CF6,#EC4899);border:none" onclick="closeSheet()">晚安</button>
      </div>`, {center:true});
    toast(`「${m}」演示原型中暂未开放`,'🛠️');
  };
  /* 深色/明亮切换：渐变过渡 */
  const tsw = $('#themeSw');
  tsw.classList.toggle('on', $('#phone').classList.contains('light'));
  tsw.onclick = e=>{
    e.stopPropagation();
    $('#phone').classList.toggle('light');
    tsw.classList.toggle('on'); tsw.classList.add('jelly');
    toast($('#phone').classList.contains('light') ? '天亮了，梦先存着' : '夜幕降临，适合做梦','🌗');
  };
};

/* 封存时间胶囊 */
function openCapsule(){
  openSheet(`<h3 class="font-display font-bold text-lg">⏳ 封存一个梦给未来</h3>
    <textarea id="capText" rows="4" class="w-full rounded-xl px-4 py-3 text-sm mt-4 outline-none"
      style="background:rgba(255,255,255,.06);border:1px solid var(--glass-brd);color:var(--ink);resize:none"
      placeholder="写给未来的自己，或封存今晚的梦…"></textarea>
    <div class="flex gap-2 mt-3">
      ${['一个月后','半年后','一年后的今天'].map((t,i)=>`<span class="chip pressable cap-when ${i===2?'sel':''}" data-w="${t}">${t}</span>`).join('')}
    </div>
    <button id="capSeal" class="pressable w-full py-3.5 mt-5 rounded-2xl text-sm text-white"
      style="background:linear-gradient(90deg,#FBBF24,#EC4899);border:none">🔒 封进胶囊</button>`);
  $$('.cap-when').forEach(c=>c.onclick=()=>{ $$('.cap-when').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); });
  $('#capSeal').onclick = ()=>{
    if(!$('#capText').value.trim()) return toast('胶囊里不能是空的哦','⏳');
    closeSheet(); confetti(); toast('胶囊已沉入梦海，到点会浮上来','⏳');
  };
}

   初始化

bindMagnetic(document);
