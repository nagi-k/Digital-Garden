<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梦屿 Dream Bank · 可交互原型演示</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  display:flex; align-items:center; justify-content:center;
  background:#070a1a;
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,sans-serif;
  overflow:hidden;
}
.aurora-bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.aurora-bg i{ position:absolute; width:60vw; height:60vw; border-radius:50%; filter:blur(110px); opacity:.34; mix-blend-mode:screen; animation:drift 30s ease-in-out infinite alternate; }
.aurora-bg i:nth-child(1){ left:-15%; top:-10%; background:radial-gradient(closest-side,#8B5CF6,transparent 70%); }
.aurora-bg i:nth-child(2){ right:-20%; top:30%; background:radial-gradient(closest-side,#06B6D4,transparent 70%); animation-duration:38s; animation-delay:-10s; opacity:.22; }
.aurora-bg i:nth-child(3){ left:10%; bottom:-30%; background:radial-gradient(closest-side,#EC4899,transparent 70%); animation-duration:44s; animation-delay:-22s; opacity:.18; }
@keyframes drift{ 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(6%,5%) scale(1.1)} 100%{transform:translate(-5%,-4%) scale(.95)} }

.demo-wrap{ text-align:center; padding:24px; }
.demo-title{ color:#F8FAFC; font-size:18px; font-weight:700; margin-bottom:8px; letter-spacing:.05em; }
.demo-sub{ color:rgba(226,232,240,.55); font-size:13px; margin-bottom:24px; }

.phone-frame{ position:relative; width:min(360px,92vw); border-radius:40px; padding:10px; margin:0 auto;
  background:linear-gradient(160deg,#2a2f4a,#12152a); border:1px solid rgba(255,255,255,.14);
  box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(139,92,246,.12); }
.phone-frame iframe{ width:100%; height:min(720px,72vh); border:none; border-radius:32px; display:block; background:#0B1026; }
.phone-notch{ position:absolute; top:18px; left:50%; transform:translateX(-50%); width:90px; height:22px; border-radius:99px;
  background:#0a0d1e; z-index:2; border:1px solid rgba(255,255,255,.06); }

.tip{ color:rgba(226,232,240,.45); font-size:11px; margin-top:14px; }
</style>
</head>
<body>
<div class="aurora-bg"><i></i><i></i><i></i></div>
<div class="demo-wrap">
  <div class="demo-title">🌙 梦屿 Dream Bank · 可交互原型</div>
  <div class="demo-sub">点击手机屏幕即可体验 · 支持 Tab 切换与各项微交互</div>
  <div class="phone-frame">
    <div class="phone-notch"></div>
    <iframe src="./prototype.html" title="梦屿 Dream Bank 可交互原型"></iframe>
  </div>
  <div class="tip">数据为内置 Mock · 碎片数会本地持久化 · 拆盲盒可触发 confetti 特效</div>
</div>
</body>
</html>
